<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fond arrondi avec dégradé premium -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  
  <!-- Anneau subtil d'accentuation -->
  <rect x="3" y="3" width="186" height="186" rx="39" fill="none" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.3" />

  <!-- Croix Médicale avec lueur -->
  <g filter="url(#glow)">
    <!-- Barre verticale -->
    <rect x="84" y="44" width="24" height="104" rx="8" fill="url(#crossGrad)" />
    <!-- Barre horizontale -->
    <rect x="44" y="84" width="104" height="24" rx="8" fill="url(#crossGrad)" />
  </g>

  <!-- Électrocardiogramme / Onde de vie au centre -->
  <path d="M52 96 L74 96 L82 78 L92 114 L102 84 L110 102 L116 96 L140 96" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Point lumineux / Sparkle -->
  <circle cx="140" cy="52" r="5" fill="#60A5FA" />
  <circle cx="52" cy="140" r="4" fill="#34D399" />
</svg>
